name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check backend sources
        run: find packages/backend/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build dashboard
        run: npm run build -w dashboard
